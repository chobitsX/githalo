[package]
name = "githalo"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"
description = "A fast, native desktop Git client built with Rust and GPUI."
repository = "https://github.com/chobitsX/githalo"
homepage = "https://github.com/chobitsX/githalo"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui_platform"]

[dependencies]
async-channel = "2.5"
chrono = "0.4"
dirs = "6"
rusqlite = { version = "0.39", features = ["bundled"] }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tempfile = "3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864", default-features = false, optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"], optional = true }

[[bin]]
name = "githalo"
path = "src/main.rs"
required-features = ["desktop"]
