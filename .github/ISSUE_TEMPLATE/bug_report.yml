name: Bug Report
description: Report an unexpected behavior or crash in GitHalo
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reliably reproduce this issue?
      placeholder: |
        1. Open repository ...
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
  - type: input
    id: os
    attributes:
      label: Operating System & Architecture
      placeholder: "e.g., macOS 15.3 (Apple Silicon), Ubuntu 24.04 (x86_64)"
    validations:
      required: true
  - type: input
    id: git_version
    attributes:
      label: Git Version
      placeholder: "Output of `git --version`"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: GitHalo Version / Commit
      placeholder: "e.g., v0.1.0 or commit hash"
  - type: textarea
    id: context
    attributes:
      label: Screenshots / Logs
      description: Attach screenshots or error output if applicable.
