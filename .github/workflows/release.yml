name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing release tag to rebuild and upload assets to (e.g. v0.6.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target

      - name: Build release binary
        working-directory: client
        run: cargo build --release --locked

      - name: Assemble GitHalo.app
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [[ "$VERSION" == "$TAG_NAME" || -z "$VERSION" ]]; then
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -n 1)"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"

          APP_DIR="dist/GitHalo.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp client/target/release/githalo "$APP_DIR/Contents/MacOS/githalo"
          chmod +x "$APP_DIR/Contents/MacOS/githalo"

          # Generate macOS .icns icon from the 1024x1024 PNG logo
          ICONSET="dist/GitHalo.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" docs/design/githalo-logo.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" docs/design/githalo-logo.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/GitHalo.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>githalo</string>
            <key>CFBundleIconFile</key>
            <string>GitHalo</string>
            <key>CFBundleIdentifier</key>
            <string>dev.githalo.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>GitHalo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Sign, Notarize, and Package DMG
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          APP_DIR="dist/GitHalo.app"
          DMG_PATH="dist/GitHalo-${RELEASE_VERSION}-macos-arm64.dmg"
          KEYCHAIN_PATH="$RUNNER_TEMP/githalo-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          SIGNING_IDENTITY=""

          cleanup() {
            rm -f "$CERT_PATH" "$API_KEY_PATH" "dist/GitHalo-notarize.zip"
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          }
          trap cleanup EXIT

          notarize_file() {
            local target="$1"
            if [[ -n "${APPLE_API_KEY_P8_BASE64:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER_ID:-}" ]]; then
              xcrun notarytool submit "$target" \
                --key "$API_KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" \
                --wait
            elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
              xcrun notarytool submit "$target" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --wait
            else
              return 1
            fi
          }

          CAN_NOTARIZE=0
          if [[ -n "${APPLE_API_KEY_P8_BASE64:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER_ID:-}" ]]; then
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            CAN_NOTARIZE=1
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            CAN_NOTARIZE=1
          fi

          # 1. Import Developer ID certificate and sign GitHalo.app (Hardened Runtime)
          if [[ -n "${APPLE_CERTIFICATE_BASE64:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application:/ {print $2; exit}')"
            if [[ -z "$SIGNING_IDENTITY" ]]; then
              echo "::error::No 'Developer ID Application' identity found in imported certificate"
              exit 1
            fi
            echo "Signing with identity: $SIGNING_IDENTITY"

            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP_DIR/Contents/MacOS/githalo"
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP_DIR"
            codesign --verify --deep --strict --verbose=2 "$APP_DIR"

            # 2. Notarize & staple GitHalo.app so offline copies pass Gatekeeper
            if [[ "$CAN_NOTARIZE" -eq 1 ]]; then
              ditto -c -k --keepParent "$APP_DIR" "dist/GitHalo-notarize.zip"
              notarize_file "dist/GitHalo-notarize.zip"
              xcrun stapler staple "$APP_DIR"
              xcrun stapler validate "$APP_DIR"
              spctl -a -t exec -vv "$APP_DIR"
            else
              echo "::warning::Apple signing certificate found, but notarization secrets are not configured; skipping notarization."
            fi
          else
            echo "::notice::APPLE_CERTIFICATE_BASE64 not configured; building unsigned DMG."
          fi

          # 3. Create drag-and-drop DMG installer
          DMG_STAGE="dist/dmg-stage"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R "$APP_DIR" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "GitHalo" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_PATH"

          # 4. Sign, notarize, and staple DMG
          if [[ -n "$SIGNING_IDENTITY" ]]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"
            codesign --verify --verbose=2 "$DMG_PATH"
            if [[ "$CAN_NOTARIZE" -eq 1 ]]; then
              notarize_file "$DMG_PATH"
              xcrun stapler staple "$DMG_PATH"
              xcrun stapler validate "$DMG_PATH"
            fi
          fi

          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/GitHalo-*-macos-arm64.dmg
            dist/GitHalo-*-macos-arm64.dmg.sha256
